# Claude Code works on a story of La Fabrique itself (la-fabrique#113): launched by a tech lead or the super admin from
# La Fabrique (the sprint's "Launch the next story", or "Launch Claude" on a ready story), or by hand (Actions > Claude >
# Run workflow, issue number).
# It follows CLAUDE.md: a branch claude/<number>-<topic> from main, linked to the issue (GitHub's Development section: La
# Fabrique finds the story's pull request by it), tests, a release-notes entry, then a pull request to main that says
# how each acceptance criterion is checked, and a comment on the issue. With `pr`, it brings that pull request up to
# date instead: merges main into its branch, resolves the conflicts, checks again and pushes to the same branch.
# It never pushes to main: a person reviews the pull request and merges it.
# Repository secrets:
# - CLAUDE_CODE_OAUTH_TOKEN (a Claude subscription: `claude setup-token`) or ANTHROPIC_API_KEY (an API key);
# - FABRIQUE_TOKEN (fine-grained, this repository: Contents, Pull requests and Issues, read and write): the branch and
#   the pull request it creates start the CI, which the GITHUB_TOKEN would not.
name: Claude
# The issue number in the run's name: La Fabrique finds the run of each story by it.
run-name: "Claude #${{ inputs.issue }}${{ inputs.pr && format(' · update #{0}', inputs.pr) || '' }}${{ inputs.rework == 'true' && ' · rework' || '' }}"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number (the story)"
        required: true
      par:
        description: "Who launched Claude (GitHub login, set by La Fabrique)"
        required: false
      pr:
        description: "A pull request of this story to bring up to date (number); empty: work on the story"
        required: false
      rework:
        description: "true: the story was tested and has feedbacks; change its code to take them into account (new branch, new pull request)"
        required: false

concurrency:
  group: claude-${{ inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Secrets
        env:
          FABRIQUE_TOKEN: ${{ secrets.FABRIQUE_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE: ${{ inputs.issue }}
          PR: ${{ inputs.pr }}
        run: |
          [ -n "$FABRIQUE_TOKEN" ] || { echo "::error::Secret FABRIQUE_TOKEN missing (see this workflow's header)."; exit 1; }
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN$ANTHROPIC_API_KEY" ] || { echo "::error::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY."; exit 1; }
          case "$ISSUE" in ''|*[!0-9]*) echo "::error::Not an issue number: $ISSUE"; exit 1 ;; esac
          case "$PR" in *[!0-9]*) echo "::error::Not a pull request number: $PR"; exit 1 ;; esac

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.FABRIQUE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies
        run: npm ci

      - name: Commit identity
        run: |
          git config user.name "Claude (La Fabrique)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The story's branch, created linked to its issue (GitHub's Development section), or the branch of the pull
      # request to bring up to date, with main merged in (the conflicts are left for Claude).
      - name: Working branch
        env:
          GH_TOKEN: ${{ secrets.FABRIQUE_TOKEN }}
          ISSUE: ${{ inputs.issue }}
          PR: ${{ inputs.pr }}
          REWORK: ${{ inputs.rework }}
          RUN: ${{ github.run_number }}
        run: |
          if [ -n "$PR" ]; then
            branch=$(gh pr view "$PR" --json headRefName,state --jq 'select(.state == "OPEN") | .headRefName')
            [ -n "$branch" ] || { echo "::error::Pull request #$PR is not open."; exit 1; }
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            if git merge --no-edit origin/main; then echo "CONFLICTS=none" >> "$GITHUB_ENV"; else echo "CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ' ')" >> "$GITHUB_ENV"; fi
          else
            data=$(gh issue view "$ISSUE" --json id,title)
            slug=$(jq -r .title <<<"$data" | iconv -f utf-8 -t ascii//TRANSLIT | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-40 | sed -E 's/-+$//')
            branch="claude/$ISSUE-${slug:-story}"
            # A rework after feedbacks: a new branch of the same story, from main as it is now.
            [ "$REWORK" = "true" ] && branch="claude/$ISSUE-rework-$RUN"
            if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              gh api graphql \
                -f query='mutation($issue: ID!, $oid: GitObjectID!, $name: String!) { createLinkedBranch(input: { issueId: $issue, oid: $oid, name: $name }) { linkedBranch { id } } }' \
                -f issue="$(jq -r .id <<<"$data")" -f oid="$(git rev-parse HEAD)" -f name="$branch" >/dev/null \
                || git push origin "HEAD:refs/heads/$branch"
            fi
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          fi
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          GH_TOKEN: ${{ secrets.FABRIQUE_TOKEN }}
          # The full test suite takes minutes: a command is waited for up to 15 minutes, never moved to the
          # background, where the run would end without it (la-fabrique#239, #226: "I'll wait for it before committing").
          BASH_DEFAULT_TIMEOUT_MS: "900000"
          BASH_MAX_TIMEOUT_MS: "1800000"
        with:
          github_token: ${{ secrets.FABRIQUE_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Started by La Fabrique's GitHub App: the action refuses bots unless named.
          allowed_bots: la-fabrique-extraordinaire
          claude_args: --max-turns 150 --allowedTools Bash,Read,Edit,Write,Glob,Grep
          prompt: |
            ${{ inputs.pr && format('You bring pull request #{0} of story #{1} up to date ({2}), launched{3} from La Fabrique.', inputs.pr, inputs.issue, github.repository, inputs.par && format(' by @{0}', inputs.par) || '') || format('You work on story #{0} of this repository ({1}), launched{2} from La Fabrique.', inputs.issue, github.repository, inputs.par && format(' by @{0}', inputs.par) || '') }}
            You are on branch `${{ env.BRANCH }}`${{ !inputs.pr && ', linked to the issue (if it already holds commits of an earlier run on this story, build on them)' || '' }}: work there, never on main.
            ${{ inputs.pr && format('main is merged into it; files left in conflict: {0}.', env.CONFLICTS) || '' }}
            1. Read the story with its comments: `gh issue view ${{ inputs.issue }} --comments`${{ inputs.pr && format(', and the pull request with its reviews: `gh pr view {0} --comments`', inputs.pr) || '' }}. Its acceptance criteria say when it is done; the card it comes from is linked at the bottom.
            2. Follow CLAUDE.md (principles, security, conventions, design).
            3. ${{ inputs.pr && 'Resolve the conflicts keeping both sides'' intent (finish the merge with `git commit --no-edit`), and answer what the reviews still ask.' || inputs.rework == 'true' && 'This story was already developed and merged, then tested: its comments that start with **Test feedback** say what fails (a criterion, what the tester saw, a screenshot). Change the code so that each feedback is addressed, without undoing what works; this is the same story, not a new one.' || 'Do the work.' }}
            4. Check: `npm run typecheck`, `npm test`; add tests for what you change.
            5. Release notes: if anything visible changes, this branch has one entry at the top of docs/release-notes.json with `"version": "next"`, today's date and no `heure`, in English, `"stories": [${{ inputs.issue }}]`. Never write a version number or a time: the merge workflow numbers and dates it when it merges, after main's newest.
            6. Push: `git push origin HEAD:${{ env.BRANCH }}` (never with --force). ${{ inputs.pr && format('Then update the description of #{0} if what it says changed.', inputs.pr) || format('Open a pull request to main: `gh pr create --base main --head {0}`, a clear title, a body in English that starts with "Refs #{1}" (the story; not "Closes": the story stays open until it is validated), says what is done and how to check it (for a rework: each test feedback and how it is addressed), then a section "## Acceptance criteria" with one line per criterion of the issue: `- [x] <criterion>: <the test that checks it>`, or `- [ ] <criterion>: <the manual step to check it, or why it is not done>`.', env.BRANCH, inputs.issue) }}
            7. Comment on the issue: the pull request, what is done, what is left or what made you hesitate.
            You have one turn: the run ends as soon as you stop, and nothing wakes you up again. Run every command in the foreground and wait for it (the full test suite takes a few minutes), never in the background; commit, push and open the pull request before you finish, even if something is left (say it in the pull request).
            Never push to main; touch neither secrets nor workflows.

      # Claude finished without a change (la-fabrique#239): the branch it was given is empty. Say so on the issue, with
      # Claude's last words and the run's link; drop the empty branch, so the story is ready again rather than "in
      # development by hand"; and fail the run, so La Fabrique says why. Work left uncommitted or not pushed is
      # committed and pushed, and the comment says a pull request is missing. A pull request being updated (`pr`) is never touched.
      - name: Nothing to merge
        if: ${{ success() && !inputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.FABRIQUE_TOKEN }}
          ISSUE: ${{ inputs.issue }}
          OUTPUT: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Work Claude left uncommitted is kept: committed as it is, then pushed below.
          if [ "$(git branch --show-current)" = "$BRANCH" ] && [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -q -m "Work in progress left uncommitted by Claude's run on #$ISSUE" -m "Run: $RUN_URL" || true
          fi
          git fetch -q origin main
          git fetch -q origin "$BRANCH" || true
          pushed=$(git rev-list --count origin/main.."origin/$BRANCH" 2>/dev/null || echo 0)
          local=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)
          pull=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          [ -n "$pull" ] && exit 0
          last=""
          if [ -n "$OUTPUT" ] && [ -f "$OUTPUT" ]; then
            last=$(jq -r '[.[] | select(.type == "result")] | last | .result // empty' "$OUTPUT" 2>/dev/null | head -c 3000)
          fi
          quote=""
          [ -n "$last" ] && quote=$'\n\nClaude\'s last words:\n\n'"$(printf '%s\n' "$last" | sed 's/^/> /')"
          if [ "$pushed" -eq 0 ] && [ "$local" -gt 0 ] && [ "$(git branch --show-current)" = "$BRANCH" ]; then
            git push origin "HEAD:$BRANCH"
            pushed=$local
          fi
          if [ "$pushed" -gt 0 ]; then
            gh issue comment "$ISSUE" --body "Claude worked on \`$BRANCH\` but opened no pull request (work left uncommitted is committed as it is): relaunch Claude on this story from La Fabrique to finish it, or open the pull request. Run: $RUN_URL$quote"
            echo "::error::Claude left commits without a pull request."
          else
            gh issue comment "$ISSUE" --body "Claude finished on this story without any change (no commit, no pull request); its empty branch is removed, the story is ready to relaunch from La Fabrique. Run: $RUN_URL$quote"
            git push origin --delete "$BRANCH" || true
            echo "::error::Claude finished without any change: nothing to merge."
          fi
          exit 1
